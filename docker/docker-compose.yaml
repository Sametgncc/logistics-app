version: '3'

services:
  postgres:
    image: postgis/postgis:15-3.4
    container_name: logistics-postgres
    restart: always
    env_file:
      - .env
    ports:
      - "5433:5432"

  logistics-service:
    build: ../backend
    container_name: logistics-backend
    ports:
      - "8080:8080"
    depends_on:
      - postgres