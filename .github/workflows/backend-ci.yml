name: Backend CI

on:
  push:
    branches:
      - develop
      - main

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21

      - name: Build project
        run: mvn -B clean package
        working-directory: backend

      - name: Build Docker Image
        run: docker build -t logistics-backend .
        working-directory: backend

      - name: Login to GHCR
        run: echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker Image
        run: docker build -t ghcr.io/${{ github.repository }}/logistics-backend:latest .
        working-directory: backend

      - name: Push Docker Image
        run: docker push ghcr.io/${{ github.repository }}/logistics-backend:latest